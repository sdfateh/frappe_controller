[project]
name = "frappe_controller"
version = "0.1.0"
description = "Central Frappe control plane for allowlisted server agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Frappe Controller maintainers"}]
# This app shares Frappe's environment. Let the resolver intersect these ranges
# with Frappe/ERPNext and other installed apps instead of forcing incompatible
# SDK/crypto upgrades or downgrades. Test both the ERP 1.34 SDK and newer SDKs.
dependencies = ["boto3[crt]>=1.34.162,<2", "cryptography>=46.0.3,<51"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["frappe_controller*"]
namespaces = true

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
