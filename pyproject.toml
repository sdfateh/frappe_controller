[project]
name = "frappe_controller"
version = "0.1.0"
description = "Central Frappe control plane for allowlisted server agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Frappe Controller maintainers"}]
dependencies = ["cryptography==46.0.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["frappe_controller*"]
namespaces = true

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
