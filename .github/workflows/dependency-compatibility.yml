name: Controller dependency compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sdk-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Intersection of the production Frappe and mos_pro SDK requirements.
          - boto3: "1.34.162"
            botocore: "1.34.162"
            cryptography: "50.0.1"
          # Also retain compatibility with the previously pinned SDK/crypto.
          - boto3: "1.43.53"
            botocore: "1.43.108"
            cryptography: "46.0.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve Controller alongside the deployment constraints
        run: >-
          python -m pip install . pytest werkzeug
          "boto3==${{ matrix.boto3 }}"
          "botocore==${{ matrix.botocore }}"
          "cryptography==${{ matrix.cryptography }}"
      - run: python -m pip check
      - run: python -m pytest tests
